# ember runs the VMs; forgejo-runner talks to Forgejo and to ember's socket.
# Keeping them apart means a guest that escaped into the ember user still
# cannot read the runner's Forgejo token.
u ember          - "ember microVM host"     /var/lib/ember
m ember          kvm
u forgejo-runner - "Forgejo runner (ember)" /var/lib/forgejo-runner
m forgejo-runner ember
