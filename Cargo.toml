[package]
name = "ember"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Run Forgejo Actions jobs in Firecracker microVMs"
repository = "https://github.com/danielphan2003/ember"
publish = false

[[bin]]
name = "ember"
path = "src/bin/ember.rs"

[[bin]]
name = "ember-agent"
path = "src/bin/ember-agent.rs"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive", "env"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
hex = "0.4.3"
hpack = "0.3.0"
http = "1.5.0"
hyper-util = "0.1.21"
libc = "0.2.191"
prost = "0.14.4"
prost-types = "0.14.4"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "stream", "json"] }
ruzstd = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_yaml = "0.9.34"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = "0.1.19"
tokio-vsock = { version = "0.7.3", features = ["tonic014"] }
tonic = "0.14.9"
tonic-health = "0.14.9"
tonic-prost = "0.14.9"
tower = "0.5.3"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
url = "2.5.8"

[build-dependencies]
protox = "0.10.0"
tonic-prost-build = "0.14.9"
